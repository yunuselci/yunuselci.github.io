<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>İndir — Reklamsız Kıble Bulucu</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial}
    .card{display:flex;flex-direction:column;align-items:center;gap:18px}
    .icon{width:120px;height:120px;border-radius:24px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.12)}
    .title{font-size:20px;font-weight:600;color:#0b3b24}
    .wrap{display:flex;gap:16px}
    a.store{display:inline-block;padding:12px 20px;text-decoration:none;color:#fff;background:#000;border-radius:10px;font-size:16px}
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Reklamsız Kıble Bulucu indir">
    <div class="icon" aria-hidden="false">
      <img src="icon.webp" alt="Reklamsız Kıble Bulucu ikonu" style="width:100%;height:100%;object-fit:cover;display:block">
    </div>
    <h1 class="title">Reklamsız Kıble Bulucu</h1>
    <div class="wrap">
      <a class="store" href="https://play.google.com/store/apps/details?id=com.yunuselci.KibleBulucu&hl=tr" aria-label="Google Play">Google Play</a>
      <a class="store" href="https://apps.apple.com/tr/app/reklams%C4%B1z-k%C4%B1ble-bulucu/id6746551056" aria-label="App Store">App Store</a>
    </div>
  </main>
</body>
</html>
